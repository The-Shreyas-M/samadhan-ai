<div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
    <div class="text-2xl font-bold text-slate-900">{{ total }}</div>
    <div class="text-xs text-slate-400 mt-1">Total · {{ in_progress }} in progress</div>
</div>
<div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
    <div class="text-2xl font-bold text-blue-600">{{ pending }}</div>
    <div class="text-xs text-slate-400 mt-1">Pending</div>
</div>
<div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
    <div class="text-2xl font-bold text-red-600">{{ critical + high }}</div>
    <div class="text-xs text-slate-400 mt-1">High / Critical</div>
</div>
<div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
    <div class="text-2xl font-bold text-emerald-600">{{ resolved }}</div>
    <div class="text-xs text-slate-400 mt-1">Resolved</div>
</div>
