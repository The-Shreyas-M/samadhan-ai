{% for t in tiles %}
<a href="/dept/{{ t.key }}" class="bg-white border border-slate-200 rounded-xl p-4 hover:shadow-md hover:border-slate-300 transition block">
    <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-slate-800">{{ t.short }}</span>
        {% if t.pending_crit > 0 %}
            <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-red-100 text-red-700 font-semibold">{{ t.pending_crit }} critical</span>
        {% endif %}
    </div>
    <div class="flex items-end justify-between">
        <span class="text-2xl font-bold text-slate-900">{{ t.total }}</span>
        <span class="text-xs text-slate-400">{{ t.resolved }} resolved</span>
    </div>
    <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full" style="width:{{ (t.total and (t.resolved * 100 // t.total)) or 0 }}%;background:{{ t.color }}"></div>
    </div>
</a>
{% endfor %}
